<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4338CA" />
    <meta name="description" content="EcclesiaFlow — a calm, offline-ready church management companion." />
    <title>EcclesiaFlow</title>
    <script>
      // Set the theme before first paint so there is no flash of the wrong one.
      // Mirrors src/hooks/useThemeStore.ts (same localStorage key and shape).
      try {
        var stored = JSON.parse(localStorage.getItem('ecclesia-theme') || '{}');
        var pref = (stored.state && stored.state.preference) || 'system';
        var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
