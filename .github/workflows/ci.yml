# Required checks for every pull request (DIF-02, DIF-14). Mark lint, build
# and security as required in branch protection (FORYOU.md).
name: CI

on:
  pull_request:
  push:
    branches: [master, staging, development]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check and build
        run: npm run build

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      # Shipped code must have no high/critical advisories. Dev-only tooling
      # advisories are tracked as exceptions in TODO.md (DIF-14).
      - name: Production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Scan history for committed secrets
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source=/repo --no-banner --redact
